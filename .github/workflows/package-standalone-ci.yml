name: Package Docker Image

on:
  workflow_call:
    inputs:
      DOCKERFILE_PATH:
        required: true
        type: string
      EXTRA_BUILD_ARGS:
        required: false
        type: string
        default: ""

env:
  CONTAINER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/${{ github.ref == 'refs/heads/main' && 'prd' || 'staging'}}

jobs:
  package:
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Checkout the repository (which repository triggered this workflow)
      - name: Checkout repository ${{ github.repository }}
        uses: actions/checkout@v4

      # Cosign is a tool for verifying container images against the
      # trusted root of trust. It prevents an attacker from
      # introducing a malicious container image into a system.
      # More information about Cosign can be found at:
      # https://github.com/sigstore/cosign
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.6.0
        with:
          cosign-release: "v2.4.0"

      # Set up BuildKit Docker container to build the Docker image
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Login to GitHub Container Registry ${{env.CONTAINER_REGISTRY}}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Process secrets and environment variables to pass to Docker build
        id: secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          process_env_vars() {
            echo "$1" | jq -r '
              to_entries 
              | map(select(
                  (.key | startswith("ORG_") | not) 
                  and (.key != "github_token")
              )) 
              | .[] 
              | "\(.key)=\(.value)"
            '
          }

          MERGED_SECRETS=""
          if [ -n "$ALL_SECRETS" ]; then
            MERGED_SECRETS="$(process_env_vars "$ALL_SECRETS")"
          fi
          if [ -n "$ALL_VARS" ]; then
            MERGED_SECRETS="${MERGED_SECRETS}"$'\n'"$(process_env_vars "$ALL_VARS")"
          fi

          if [ -n "$MERGED_SECRETS" ]; then
            BUILD_ARGS=""
            while IFS='=' read -r key value; do
              if [ -n "$key" ]; then
                BUILD_ARGS="${BUILD_ARGS}${key}=${value}"$'\n'
              fi
            done <<< "$MERGED_SECRETS"

            {
              echo "build-args<<EOF"
              echo "$BUILD_ARGS"
              echo "${{ inputs.EXTRA_BUILD_ARGS }}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "No secrets to process"
          fi

      # Build and push Docker image with Buildx
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.workspace }}
          file: ${{ inputs.DOCKERFILE_PATH }}
          build-args: ${{ steps.secrets.outputs.build-args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
